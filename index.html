<!-- =====================================================
     Isometric, infinitely-looping card stack. Cards are
     positioned individually by script.js so they can wrap
     around forever — see script.js for the loop math.

     TO ADD YOUR OWN VIDEOS: point each <source src="..."> at
     an .mp4 in /assets. Until you do, each card shows a
     soft placeholder gradient.
     ===================================================== -->
<main class="stack-scene" id="stackScene">
  <div class="stack-track" id="stackTrack">

    <article class="card" data-title="Nightbound" data-tag="Feature Film · Sound Design">
      <div class="card-face">
        <video class="card-video" muted loop playsinline preload="metadata">
          <source src="assets/project-01.mp4" type="video/mp4">
        </video>
        <div class="card-fallback" aria-hidden="true"></div>
        <div class="card-sheen" aria-hidden="true"></div>
      </div>
    </article>
