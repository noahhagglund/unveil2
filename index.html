<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noah Hägglund — Work</title>
<meta name="description" content="Sound design and music by Noah Hägglund — Stockholm.">

<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="corner corner-top-left">
  <span class="mark">N—H</span>
</header>

<header class="corner corner-top-right mono" id="projectCounter">01 / 08</header>

<p class="corner corner-bottom-left mono">Sound Design &amp; Music — Stockholm</p>

<p class="corner corner-bottom-right mono">Scroll or drag to browse</p>

<!-- =====================================================
     Isometric, infinitely-looping card stack.
     Cards are positioned individually by script.js (not by
     CSS layout) so their positions can wrap around forever
     in either direction — see script.js for the loop math.

     TO ADD YOUR OWN VIDEOS: point each <source src="..."> at
     an .mp4 in /assets. Until you do, each card shows a
     gradient placeholder.
     ===================================================== -->
<main class="stack-scene" id="stackScene">
  <div class="stack-track" id="stackTrack">

    <article class="card" data-title="Nightbound" data-tag="Feature Film · Sound Design">
      <div class="card-face">
        <video class="card-video" muted loop playsinline preload="metadata">
          <source src="assets/project-01.mp4" type="video/mp4">
        </video>
        <div class="card-fallback" aria-hidden="true"></div>
      </div>
    </article>

    <article class="card" data-title="Hollow Grove" data-tag="Indie Game · Original Score">

      </div>
    </article>

    <article class="card" data-title="Salt &amp; Static" data-tag="Brand Sonic Identity">

    </article>

    <article class="card" data-title="Echo Chamber" data-tag="Gallery Installation">

    </article>

  </div>

  <div class="active-info" id="activeInfo">
    <span class="mono active-info-tag" id="activeTag">Feature Film · Sound Design</span>
    <h1 class="active-info-title" id="activeTitle">Nightbound</h1>
  </div>
</main>

<script src="script.js"></script>
